name: Build Android APK

# بيبني الـ APK أوتوماتيك من غير Android Studio: اختبارات ثم بناء release.
# بيتشغّل لما تعدّل حاجة في android-wife-assistant/ أو يدوياً من تبويب Actions.
on:
  workflow_dispatch:
    inputs:
      signed_review:
        description: "Build with the original key and upload for review without public distribution"
        type: boolean
        default: false
      publish_release:
        description: "Publish with the existing, verified upgrade-compatible signing key"
        type: boolean
        default: false
      release_version_code:
        description: "Verified integer higher than the installed app's versionCode"
        type: string
        default: ""
      signing_sha256:
        description: "Expected SHA-256 fingerprint of the existing installed app certificate"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "android-wife-assistant/**"
      - ".github/workflows/android.yml"
  # Pull requests were not gated at all: every PR to this repository landed
  # unverified, whatever it touched.
  pull_request:
    paths:
      - "android-wife-assistant/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wife-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release prerequisites
        id: signing
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REVIEW_ONLY: ${{ inputs.signed_review }}
          PUBLISH_PUBLIC: ${{ inputs.publish_release }}
          RELEASE_CODE: ${{ inputs.release_version_code }}
          EXPECTED_CERT: ${{ inputs.signing_sha256 }}
        run: |
          if [[ "$REVIEW_ONLY" == "true" && "$PUBLISH_PUBLIC" == "true" ]]; then
            echo "Choose signed review or public publication, not both."
            exit 1
          fi
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!secret_name}" || { echo "Missing original signing credential: $secret_name. Publication stopped."; exit 1; }
          done
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Supply a verified higher versionCode."; exit 1; }
          cert=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ')
          [[ "$cert" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "Supply the existing installed signing certificate SHA-256."; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Using the runner's preinstalled Android 35 SDK; no blanket license acceptance."

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 1) اختبارات الوحدة (JUnit) قبل البناء — لو فشلت البناء بيقف.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build unsigned release candidate with R8
        if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.publish_release || inputs.signed_review) }}
        env:
          KEYSTORE_FILE: ""
          VERSION_CODE: "5"
          VERSION_NAME: "1.1.5-candidate"
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify unsigned candidate and record source
        if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.publish_release || inputs.signed_review) }}
        run: |
          candidate_dir="$RUNNER_TEMP/WisalCandidate"
          mkdir -p "$candidate_dir"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$candidate_dir/WisalUnsignedCandidate.apk"
          unzip -tq "$candidate_dir/WisalUnsignedCandidate.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$candidate_dir/WisalUnsignedCandidate.apk" > "$RUNNER_TEMP/CandidateMetadata.txt"
          grep -q "package: name='com.wisal.app'" "$RUNNER_TEMP/CandidateMetadata.txt"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$candidate_dir/WisalUnsignedCandidate.apk" > "$RUNNER_TEMP/CandidateSignatureCheck.txt" 2>&1; then
            echo "Unexpected signature on an explicitly unsigned test candidate."
            exit 1
          fi
          cd "$candidate_dir"
          sha256sum WisalUnsignedCandidate.apk > "Wisal Candidate Checksums.txt"
          printf '%s\n' "$GITHUB_SHA" > "Source Commit.txt"
          printf '%s\n' 'UNSIGNED build candidate. Not installable or published. Use the existing signing identity only. E2EE acceptance remains open.' > "Candidate Status.txt"

      - name: Upload unsigned review candidate
        if: ${{ github.event_name != 'workflow_dispatch' || !(inputs.publish_release || inputs.signed_review) }}
        uses: actions/upload-artifact@v4
        with:
          name: WisalUnsignedCandidate
          path: ${{ runner.temp }}/WisalCandidate/
          retention-days: 7
          if-no-files-found: error

      # حالة التوقيع في اللوج بوضوح — عشان تعرف إن كنت هتنشر على Play جاهز ولا لأ.
      - name: Signing status
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        run: echo "Original signing credentials passed preflight; certificate verification follows the build."

      # Existing signing identity only; absent secrets block release publication.
      - name: Decode keystore (optional signing)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      # 3) بناء نسخة release (APK قابل للتثبيت).
      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Explicit versionCode must exceed the installed release, including pre-move builds.
          VERSION_CODE: ${{ inputs.release_version_code }}
          VERSION_NAME: "1.1.${{ inputs.release_version_code }}"
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 4) بناء App Bundle (AAB) للرفع على Google Play.
      - name: Build release AAB (for Google Play)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.release_version_code }}
          VERSION_NAME: "1.1.${{ inputs.release_version_code }}"
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Prepare artifacts (wisal.apk / wisal.aab)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../wisal.apk
          cp app/build/outputs/bundle/release/app-release.aab ../wisal.aab

      - name: Verify upgrade signing identity
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        env:
          EXPECTED_CERT: ${{ inputs.signing_sha256 }}
          RELEASE_CODE: ${{ inputs.release_version_code }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ../wisal.apk > "$RUNNER_TEMP/wisal-certificate.txt"
          actual=$(awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' "$RUNNER_TEMP/wisal-certificate.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected" || { echo "Signing identity mismatch. Publication stopped; do not uninstall the installed app."; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging ../wisal.apk > "$RUNNER_TEMP/SignedPackageMetadata.txt"
          grep -q "package: name='com.wisal.app' versionCode='$RELEASE_CODE'" "$RUNNER_TEMP/SignedPackageMetadata.txt"
          printf '%s\n' "$GITHUB_SHA" > "../Source Commit.txt"
          printf '%s\n' 'Signed maintenance build. E2EE acceptance remains unverified; mayClaimE2ee=false.' > "../Build Status.txt"
          (cd .. && sha256sum wisal.apk wisal.aab > SHA256SUMS.txt)

      # قناة توزيع إضافية: فرع apk-dist فيه الـ APK/AAB مباشرة — بيتسحب بالـ git
      # (مفيد لما تنزيل الـ release من المتصفح يتعطّل، وبيتكتب فوقه كل بناء).
      # continue-on-error: git push بيرفض أي ملف أكبر من 100MB (بدون LFS) —
      # القناة دي ثانوية وميّتة أصلًا في الحالة دي، لازم ما توقّفش القناة
      # الأساسية (GitHub Release تحت) لو حجم الـ APK كبر مستقبلاً.
      - name: Publish APK to apk-dist branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && steps.signing.outputs.ready == 'true' }}
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          rm -rf /tmp/apkdist && mkdir /tmp/apkdist
          cp wisal.apk wisal.aab /tmp/apkdist/
          cd /tmp/apkdist
          sha256sum wisal.apk wisal.aab > SHA256SUMS.txt
          git init -q -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "dist: wisal.apk from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-dist

      # Required review deliverable: a failed upload must not report a successful review build.
      - name: Upload signed review artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_release || inputs.signed_review) && steps.signing.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WisalSignedReview
          path: |
            wisal.apk
            wisal.aab
            SHA256SUMS.txt
            Source Commit.txt
            Build Status.txt
          if-no-files-found: error
          retention-days: 5

      # رابط تنزيل ثابت: أحدث نسخة دايماً على release واحد اسمه android-latest.
      - name: Publish rolling release (latest build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && steps.signing.outputs.ready == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "أحدث نسخة وصال (Wisal)"
          body: |
            وصال - أحدث نسخة جاهزة.
            • للتثبيت المباشر على الموبايل: نزّل `wisal.apk` من Assets تحت.
            • للرفع على Google Play: استخدم `wisal.aab`.
            احتفظ بنسخة احتياطية، وتحقق أن توقيع التحديث يطابق التطبيق المثبت. لا تحذف التطبيق لتجاوز تعارض التوقيع.
          files: |
            wisal.apk
            wisal.aab
            SHA256SUMS.txt
          make_latest: true

      - name: Upload test reports and fictional UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisal-verification
          path: |
            android-wife-assistant/app/build/reports/tests/
            android-wife-assistant/app/build/test-results/
            android-wife-assistant/app/build/wisal-screenshots/
          retention-days: 7
