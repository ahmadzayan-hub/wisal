name: Build Android APK

# بيبني الـ APK أوتوماتيك من غير Android Studio: اختبارات ثم بناء release.
# بيتشغّل لما تعدّل حاجة في android-wife-assistant/ أو يدوياً من تبويب Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wife-assistant/**"
      - ".github/workflows/android.yml"
  # Pull requests were not gated at all: every PR to this repository landed
  # unverified, whatever it touched.
  pull_request:
    paths:
      - "android-wife-assistant/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # نرفع السر لمتغيّر بيئة لأن سياق secrets مش متاح في شرط if.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android-wife-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 1) اختبارات الوحدة (JUnit) قبل البناء — لو فشلت البناء بيقف.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      # حالة التوقيع في اللوج بوضوح — عشان تعرف إن كنت هتنشر على Play جاهز ولا لأ.
      - name: Signing status
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Release signing: ENABLED (using repository secrets) — جاهز لـ Play."
          else
            echo "⚠️ Release signing: DISABLED (debug signing)."
            echo "   للنشر على Play أضِف الأسرار: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (docs/DEPLOY_WISAL.md)."
          fi

      # 2) توقيع اختياري: لو ضفت الأسرار بيتوقّع release حقيقي، غير كده debug.
      - name: Decode keystore (optional signing)
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      # 3) بناء نسخة release (APK قابل للتثبيت).
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ترقيم إصدار تلقائي متزايد من رقم البناء عشان تحديثات التطبيق تتثبّت فوق بعضها.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 4) بناء App Bundle (AAB) للرفع على Google Play.
      - name: Build release AAB (for Google Play)
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Prepare artifacts (wisal.apk / wisal.aab)
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../wisal.apk
          cp app/build/outputs/bundle/release/app-release.aab ../wisal.aab

      # قناة توزيع إضافية: فرع apk-dist فيه الـ APK/AAB مباشرة — بيتسحب بالـ git
      # (مفيد لما تنزيل الـ release من المتصفح يتعطّل، وبيتكتب فوقه كل بناء).
      # continue-on-error: git push بيرفض أي ملف أكبر من 100MB (بدون LFS) —
      # القناة دي ثانوية وميّتة أصلًا في الحالة دي، لازم ما توقّفش القناة
      # الأساسية (GitHub Release تحت) لو حجم الـ APK كبر مستقبلاً.
      - name: Publish APK to apk-dist branch
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          rm -rf /tmp/apkdist && mkdir /tmp/apkdist
          cp wisal.apk wisal.aab /tmp/apkdist/
          cd /tmp/apkdist
          sha256sum wisal.apk wisal.aab > SHA256SUMS.txt
          git init -q -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "dist: wisal.apk from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-dist

      # اختياري: أرشيف الـ CI. مش بيوقف الـ pipeline لو مساحة أرشيف الـ Actions
      # اتملت — التنزيل الأساسي بيتنشر على release ثابت تحت (android-latest).
      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wisal-android
          path: |
            wisal.apk
            wisal.aab
          if-no-files-found: error
          retention-days: 5

      # رابط تنزيل ثابت: أحدث نسخة دايماً على release واحد اسمه android-latest.
      - name: Publish rolling release (latest build)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "أحدث نسخة وصال (Wisal)"
          body: |
            وصال - أحدث نسخة جاهزة.
            • للتثبيت المباشر على الموبايل: نزّل `wisal.apk` من Assets تحت.
            • للرفع على Google Play: استخدم `wisal.aab`.
            أول تثبيت للـ APK محتاج تسمح بتثبيت من "مصادر غير معروفة".
          files: |
            wisal.apk
            wisal.aab
          make_latest: true

      # تنظيف: نشيل أي ملفات قديمة من الـ release (زي wife-assistant.apk) فيفضل
      # فيه wisal.apk و wisal.aab بس - عشان رابط التنزيل يبقى نضيف.
      - name: Prune stale release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          rel=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/android-latest")
          ids=$(printf '%s' "$rel" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(a['id']) for a in d.get('assets',[]) if a['name'] not in ('wisal.apk','wisal.aab')]")
          for id in $ids; do
            echo "Deleting stale asset id=$id"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$id"
          done
