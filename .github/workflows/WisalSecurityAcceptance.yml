name: Wisal security acceptance
on:
  pull_request:
    paths:
      - 'android-wife-assistant/**'
      - 'wisal-direct-relay/**'
      - 'verification/security/**'
      - '.github/workflows/WisalSecurityAcceptance.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wisaltest
          POSTGRES_PASSWORD: syntheticOnly
          POSTGRES_DB: wisaltest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wisaltest -d wisaltest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: npm ci --ignore-scripts
        working-directory: wisal-direct-relay
      - run: npm audit --omit=dev --audit-level=high
        working-directory: wisal-direct-relay
      - run: npm run check && npm test
        working-directory: wisal-direct-relay
        env:
          REQUIRE_PG: '1'
          RELAY_TEST_DATABASE_URL: postgresql://wisaltest:syntheticOnly@localhost:5432/wisaltest
      - run: gradle --no-daemon -p verification/security test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WisalSecurityResults
          path: verification/security/build/test-results/test
