name: Direct relay checks

# فحص باك-إند wisal-direct-relay: صحة الصياغة + اختبارات المنطق النقي
# (تسجيل جهاز، إيداع/سحب/تأكيد مغلف، فحص تسرّب plaintext). بيتشغّل مع أي
# تعديل في المجلد.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wisal-direct-relay/**"
      - ".github/workflows/direct-relay.yml"
  # Pull requests were not gated at all: every PR to this repository landed
  # unverified, whatever it touched.
  pull_request:
    paths:
      - "wisal-direct-relay/**"
      - ".github/workflows/direct-relay.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Real PostgreSQL for test/pg-store.test.js (concurrent claims and
    # registrations). REQUIRE_PG=1 makes that test fail instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAY_TEST_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay_test
      REQUIRE_PG: "1"
    defaults:
      run:
        working-directory: wisal-direct-relay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax + tests
        run: |
          npm run check
          npm test
