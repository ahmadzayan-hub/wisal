name: Relay client JVM contracts
on:
  pull_request:
    paths:
      - 'android-wife-assistant/**'
      - 'verification/relay-client/**'
      - '.github/workflows/relay-client.yml'
  push:
    branches: [main]
    paths:
      - 'android-wife-assistant/**'
      - 'verification/relay-client/**'
      - '.github/workflows/relay-client.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon -p verification/relay-client test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-client-test-results
          path: verification/relay-client/build/test-results/test
