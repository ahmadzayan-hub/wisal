name: Cloud API checks

# فحص باك-إند wisal-cloud-api: صحة الصياغة + الاختبارات النقية (بناء رسائل،
# توقيع webhook، مقارنة آمنة، محدّد معدّل). بيتشغّل مع أي تعديل في المجلد.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wisal-cloud-api/**"
      - ".github/workflows/cloud-api.yml"
  # Pull requests were not gated at all: every PR to this repository landed
  # unverified, whatever it touched.
  pull_request:
    paths:
      - "wisal-cloud-api/**"
      - ".github/workflows/cloud-api.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisal-cloud-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax + tests
        run: |
          npm run check
          npm test
